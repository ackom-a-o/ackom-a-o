<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
<title id="title">Arnold Ackom Oduro — Embedded systems, PCB design and C/C++</title>
<desc id="desc">Minimal, GitHub-native banner: name, subtitle, subtle trace and small badge; adapts to light/dark mode.</desc>
<style>
  /* Clean, desaturated colors that adapt to GitHub light/dark themes */
  .name { fill: #f0f6fc; font-weight:700; }
  .subtitle { fill: #9aa4ad; }
  .meta { fill: #6ee7b7; opacity:0.9; }
  .trace { stroke: #2dd4bf; stroke-opacity:0.9; }

  @media (prefers-color-scheme: light) {
    .name { fill: #0b1220; }
    .subtitle { fill: #475569; }
    .meta { fill: #0ea5a4; opacity:0.85; }
    .trace { stroke: #0ea5a4; stroke-opacity:0.65; }
  }
</style>

<!-- Simplified layout: no heavy decorations, minimal accent and trace -->
<g font-family="Inter, Arial, Helvetica, sans-serif">
  <text x="52" y="120" class="name" font-size="48">Arnold Ackom Oduro</text>
  <text x="52" y="160" class="subtitle" font-size="18">Embedded systems · PCB design · C / C++</text>
</g>

<!-- Small badge at top-right: initials inside faint rounded square -->
<g transform="translate(930,110)">
  <rect x="0" y="0" width="60" height="60" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.08"/>
  <text x="30" y="40" text-anchor="middle" class="meta" font-size="20" font-family="Inter, Arial, Helvetica, sans-serif">AO</text>
</g>

<!-- Minimal trace for subtle motion; low-contrast, slow animation -->
<path d="M52 240h360l18-18h240" fill="none" class="trace" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="64 360">
  <animate attributeName="stroke-dashoffset" values="420;0" dur="9s" repeatCount="indefinite"/>
</path>

</svg>
